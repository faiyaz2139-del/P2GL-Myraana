name: Myraana integration checks
on:
  push:
    branches:
      - integration/production-readiness-20261011
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/integration-checks.yml
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "pydantic>=2,<3" "pymupdf>=1.24,<2" "pypdf>=5,<7" "Pillow>=11,<13" "reportlab>=4,<6"
      - name: Run isolated backend safety and costing tests
        working-directory: backend
        run: python tests/run_tests.py
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compile frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build
