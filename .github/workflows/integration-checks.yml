name: Myraana integration checks
on:
  push:
    branches:
      - integration/production-readiness-20261011
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/integration-checks.yml
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "pydantic>=2,<3" "pymupdf>=1.24,<2" "pypdf>=5,<7" "Pillow>=11,<13" "reportlab>=4,<6"
      - name: Run isolated backend safety and costing tests
        working-directory: backend
        run: python tests/run_tests.py
      - name: Install route endpoint test dependencies
        run: python -m pip install "fastapi==0.110.1" "starlette==0.37.2" "httpx==0.28.1" "motor==3.3.1" "pymongo==4.6.3" "bcrypt==4.1.3" "python-dotenv==1.2.4" "python-multipart==0.0.32" "pytest>=8,<10"
      - name: Verify route endpoints without a database or printer
        env:
          PYTHONPATH: backend:backend/tests
        run: python -m pytest -c /dev/null backend/tests/test_route_api.py -q
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund ajv@8.17.1 ajv-keywords@5.1.0
          node -e "require('ajv-keywords'); require('ajv/dist/compile/codegen')"
      - name: Compile frontend
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build
      - name: Test route selection and error feedback
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand --testPathPattern=ProductionRoute.test
