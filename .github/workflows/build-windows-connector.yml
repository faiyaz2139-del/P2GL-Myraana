name: Build unsigned Myraana Windows Connector

on:
  pull_request:
    paths:
      - "frontend/public/setup/**"
      - "artifacts/myraana-windows-connector/**"
      - ".github/workflows/build-windows-connector.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/public/setup/**"
      - ".github/workflows/build-windows-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CONNECTOR_DIR: frontend/public/setup
      REQUIREMENTS_FILE: frontend/public/setup/requirements.txt
      BUILD_SCRIPT: frontend/public/setup/build-myraana-connector.ps1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS_FILE }}

      - name: Install pinned build dependencies
        run: python -m pip install --requirement $env:REQUIREMENTS_FILE

      - name: Test setup and pairing without network or printers
        run: python artifacts/myraana-windows-connector/test_connector_setup.py

      - name: Build unsigned preview executable
        run: |
          Set-Location $env:CONNECTOR_DIR
          & ".\build-myraana-connector.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Connector build failed with exit code $LASTEXITCODE"
          }

      - name: Validate executable output
        run: |
          $executables = @(
            Get-ChildItem "$env:CONNECTOR_DIR\dist" -Filter "*.exe" -File -Recurse
          )
          if ($executables.Count -eq 0) {
            throw "No Windows executable was created."
          }
          $executables | ForEach-Object {
            if ($_.Length -lt 1024) { throw "Connector executable is unexpectedly small: $($_.FullName)" }
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            Write-Output "Executable: $($_.FullName)"
            Write-Output "Size: $($_.Length) bytes"
            Write-Output "SHA256: $($hash.Hash)"
          }

      - name: Smoke-test executable without network or printing
        run: |
          $exe = Join-Path $env:CONNECTOR_DIR "dist\MyraanaConnector\MyraanaConnector.exe"
          if (-not (Test-Path $exe)) { throw "Connector executable missing" }
          python -c "import subprocess,sys; p=subprocess.run([sys.argv[1],'--self-test'],capture_output=True,text=True,timeout=30); print(p.stdout+p.stderr); assert p.returncode == 0, 'Connector setup window smoke test failed'" "$exe"

      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: myraana-windows-connector-preview-${{ github.run_number }}
          path: frontend/public/setup/dist/**
          if-no-files-found: error
          retention-days: 5
          compression-level: 0