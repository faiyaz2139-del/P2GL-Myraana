name: Build unsigned Myraana Windows Connector

on:
  pull_request:
    paths:
      - "frontend/public/setup/**"
      - "artifacts/myraana-windows-connector/**"
      - ".github/workflows/build-windows-connector.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/public/setup/**"
      - "artifacts/myraana-windows-connector/**"
      - ".github/workflows/build-windows-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: windows-connector-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      CONNECTOR_DIR: frontend/public/setup
      REQUIREMENTS_FILE: frontend/public/setup/requirements.txt
      BUILD_SCRIPT: frontend/public/setup/build-myraana-connector.ps1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS_FILE }}

      - name: Install pinned build dependencies
        run: python -m pip install --requirement $env:REQUIREMENTS_FILE

      - name: Test setup and pairing without network or printers
        run: python artifacts/myraana-windows-connector/test_connector_setup.py

      - name: Build unsigned preview executable
        run: |
          Set-Location $env:CONNECTOR_DIR
          & ".\build-myraana-connector.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Connector build failed with exit code $LASTEXITCODE"
          }

      - name: Validate executable output
        run: |
          $executables = @(
            Get-ChildItem "$env:CONNECTOR_DIR\dist" -Filter "*.exe" -File -Recurse
          )
          if ($executables.Count -eq 0) {
            throw "No Windows executable was created."
          }
          $executables | ForEach-Object {
            if ($_.Length -lt 1024) { throw "Connector executable is unexpectedly small: $($_.FullName)" }
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            Write-Output "Executable: $($_.FullName)"
            Write-Output "Size: $($_.Length) bytes"
            Write-Output "SHA256: $($hash.Hash)"
          }

      - name: Smoke-test executable without network or printing
        run: |
          $exe = Join-Path $env:CONNECTOR_DIR "dist\MyraanaConnector.exe"
          if (-not (Test-Path $exe)) { throw "Connector executable missing" }
          python -c "import subprocess,sys; p=subprocess.run([sys.argv[1],'--self-test'],capture_output=True,text=True,timeout=90); print(p.stdout+p.stderr); assert p.returncode == 0, 'Frozen connector failed to import discovery and fiery_hold'" "$exe"

      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: myraana-windows-connector-preview-${{ github.run_number }}
          path: frontend/public/setup/dist/**
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - name: Publish downloadable preview ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $package = Join-Path $env:RUNNER_TEMP "MyraanaConnector.zip"
          Compress-Archive -Path "$env:CONNECTOR_DIR/dist/MyraanaConnector.exe" -DestinationPath $package -Force
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLower()
          $checksum = Join-Path $env:RUNNER_TEMP "MyraanaConnector.sha256"
          "$hash  MyraanaConnector.zip" | Set-Content -Path $checksum -Encoding ascii
          $notes = Join-Path $env:RUNNER_TEMP "connector-release-notes.md"
          @"
          Unsigned Windows connector. On myraana.com, Connect this computer downloads one setup exe. Open that file.
          It installs itself, pairs, and keeps running in the system tray. It can start with Windows. Opening it again reconnects with no code.
          This connector finds your printers and can place approved PRINT_READY files on your Fiery HOLD queue. It never prints or releases jobs.
          Source commit: $env:GITHUB_SHA
          ZIP SHA-256: $hash
          Real shop hardware acceptance remains required.
          "@ | Set-Content -Path $notes -Encoding utf8
          gh release view windows-connector-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-connector-preview --target $env:GITHUB_SHA --title "Myraana Windows Connector" --prerelease --latest=false --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Preview release creation failed" }
          }
          gh release upload windows-connector-preview $package $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw "Preview package upload failed" }
          gh release edit windows-connector-preview --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Preview release notes update failed" }
