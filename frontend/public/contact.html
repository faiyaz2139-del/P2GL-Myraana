<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · Myraana</title>
  <meta name="description" content="Send a message to Myraana. The form stores a request and does not create a shop." />
  <link rel="icon" href="/myraana-mark.svg" />
  <style>
    body{margin:0;font-family:Inter,sans-serif;background:#f4efe6;color:#1c2a3a}
    header,main{max-width:720px;margin:auto;padding:24px}
    h1{font-family:Georgia,serif;font-size:40px}
    label{display:block;margin:12px 0;font-size:14px;font-weight:650}
    input,textarea{width:100%;margin-top:6px;padding:10px;border:1px solid #e4d9c8;border-radius:8px;font:inherit}
    button{background:#16324f;color:#f4efe6;border:0;border-radius:999px;padding:12px 18px;font-weight:650}
    a{color:#16324f}
  </style>
</head>
<body>
  <header><a href="/">Myraana</a> · <a href="/login">Sign in</a></header>
  <main>
    <h1>Write to Myraana.</h1>
    <p>This form stores a message with the other shop requests. Myraana does not publish a separate support address yet. Print2Go London’s own store details stay on print2go.com.</p>
    <form id="contact">
      <label>Your name<input name="name" maxlength="80" /></label>
      <label>Email<input name="email" type="email" required /></label>
      <label>Shop<input name="shop" maxlength="120" /></label>
      <label>Message<textarea name="message" required rows="5" maxlength="2000"></textarea></label>
      <button type="submit">Send message</button>
      <p id="contact-result" role="status"></p>
    </form>
  </main>
  <script>
    document.getElementById("contact").addEventListener("submit", async function (event) {
      event.preventDefault();
      var result = document.getElementById("contact-result");
      var body = Object.fromEntries(new FormData(event.currentTarget));
      body.intent = "contact";
      var response = await fetch("/api/public/leads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      var data = await response.json().catch(function () { return {}; });
      result.textContent = response.ok ? "Message saved. We will reply to the email you entered." : (data.error || "Unable to save. Please retry.");
      if (response.ok) event.currentTarget.reset();
    });
  </script>
</body>
</html>
